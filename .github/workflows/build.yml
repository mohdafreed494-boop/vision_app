name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          mkdir -p project_extracted
          unzip -q vision_app.zip.zip -d project_extracted
          SOURCE_DIR=$(find project_extracted -name "pubspec.yaml" -exec dirname {} \;)
          cp -rn "$SOURCE_DIR"/* .
          rm -rf project_extracted
          ls -la

      - name: Clean Proxy Settings
        run: |
          if [ -f "android/gradle.properties" ]; then
            sed -i '/systemProp.http.proxy/d' android/gradle.properties
            sed -i '/systemProp.https.proxy/d' android/gradle.properties
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vision_app_debug_apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
